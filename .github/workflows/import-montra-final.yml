name: Import Montra final application code
on:
  push:
    paths:
      - '.montra-transfer/part-*.txt'

permissions:
  contents: write

jobs:
  import-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for complete transfer
        id: parts
        shell: bash
        run: |
          count=$(find .montra-transfer -maxdepth 1 -type f -name 'part-*.txt' 2>/dev/null | wc -l)
          if [ "$count" -eq 10 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore verified final patch
        if: steps.parts.outputs.complete == 'true'
        shell: bash
        run: |
          for i in $(seq 0 9); do n=$(printf "%02d" "$i"); cat ".montra-transfer/part-$n.txt"; done | base64 --decode > /tmp/montra-final.patch.xz
          echo "2112f6035ec7d5fd9add1f72604aef1e461985a6fb567b2eb25fd2e7149b0351  /tmp/montra-final.patch.xz" | sha256sum -c -
          xz -dc /tmp/montra-final.patch.xz > /tmp/montra-final.patch
          git apply --check /tmp/montra-final.patch
          git apply /tmp/montra-final.patch
          rm -rf .montra-transfer
          mkdir -p dist
          cp investments.js opportunities.js dist/
          node --test tests/*.test.*
          rm -rf dist
      - name: Commit final Montra application
        if: steps.parts.outputs.complete == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload complete Montra application (Phase 8)"
          git push origin HEAD:main
