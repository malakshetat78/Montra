function incomesTotal(){return Number(state.income||0)+(state.incomes||[]).reduce((a,x)=>a+Number(x.amount),0)}

function endMonthDays(){let d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()}
function nextDue(day){let d=new Date(), y=d.getFullYear(),m=d.getMonth(),today=d.getDate();let due=Math.min(day,new Date(y,m+1,0).getDate());if(due<today){m++;if(m>11){m=0;y++}due=Math.min(day,new Date(y,m+1,0).getDate())}let date=new Date(y,m,due);let days=Math.round((date-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);return {days,date:date.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}}
function deadlineMonths(date){if(!date)return null;let end=new Date(date+'T00:00:00'),d=new Date(),today=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.max(0,Math.ceil((end-today)/(365.2425/12*86400000)))}
function goalDetails(g){let remaining=Math.max(0,g.target-g.saved),n=g.monthly>0?Math.ceil(remaining/g.monthly):null,deadline=deadlineMonths(g.target_date),needed=deadline>0?remaining/deadline:null;let dateInfo=g.target_date?(deadline===0?(remaining?'Target date has arrived or passed.':'Goal reached!'):`Target ${esc(g.target_date)} · Approx. ${money(Math.ceil(needed))}/month needed over ${deadline} month${deadline===1?'':'s'}.`):'No target date set.';return `<div class="goal-details"><div class="forecast">${dateInfo}<br><span>Estimate assumes a fixed price and steady savings.</span></div><label for="scenario-${g.id}">Try an extra monthly saving (${currencyCode()})</label><input id="scenario-${g.id}" class="scenario" type="number" min="0" step="1" value="0" data-id="${g.id}"><div class="scenario-result" id="scenario-result-${g.id}">${remaining===0?'Goal reached!':n===null?'Enter an extra amount to see an estimate.':`At ${money(g.monthly)}/month: about ${n} months.`}</div></div>`}
function enhanceGoals(root=document){if(page!=='goals')return;for(let original of state.goals){let g=goalWithAssets(original);let btn=root.querySelector(`[onclick="goalForm('${g.id}')"]`);if(!btn||btn.closest('.goalbox').querySelector('.goal-details'))continue;btn.closest('.goalbox').insertAdjacentHTML('beforeend',goalDetails(g));let input=document.getElementById('scenario-'+g.id);input.addEventListener('input',()=>{let extra=Math.max(0,Number(input.value)||0),rate=g.monthly+extra,remaining=Math.max(0,g.target-g.saved),out=document.getElementById('scenario-result-'+g.id);out.textContent=!remaining?'Goal reached!':rate>0?`At ${money(rate)}/month: about ${Math.ceil(remaining/rate)} months.`:'Enter a monthly amount to see an estimate.'})}}

function planForm(type,id){let isIncome=type==='income',arr=isIncome?(state.incomes||[]):(state.commitments||[]),x=arr.find(i=>i.id===id)||{},title=isIncome?'income source':'commitment';showForm(`<form id="planform"><h2>${id?'Edit':'Add'} ${title}</h2><p>${isIncome?'For example: salary or freelance work.':'For example: rent or a subscription.'}</p><label>Name</label><input name="name" maxlength="80" required value="${esc(x.name||'')}" placeholder="${isIncome?'Salary':'Rent'}"><label>Monthly amount (EGP)</label><input name="amount" type="number" min="0.01" step="0.01" value="${x.amount??''}" required>${isIncome?'':`<label>Day due each month</label><input name="due_day" type="number" min="1" max="31" step="1" value="${x.due_day??1}" required><p class="warning">Dates after the end of a shorter month are shown on that month’s last day.</p>`}<div class="actions"><button type="button" class="secondary" onclick="closeForm()">Cancel</button><button class="primary">Save</button></div></form>`);document.getElementById('planform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),v={name:String(f.get('name')).trim(),amount:Number(f.get('amount'))};if(!v.name){alert('Please enter a name.');return}if(!isIncome)v.due_day=Number(f.get('due_day'));let table=isIncome?'montra_income_sources':'montra_commitments';if(await writeData(()=>id?db.from(table).update(v).eq('id',id):db.from(table).insert(v))){closeForm();await loadData()}}}

function planningEstimate(){let income=incomesTotal(),commitments=commitmentsTotal(),prev=previousMonthKey(),last=state.expenses.filter(x=>x.date.startsWith(prev)),current=monthly();let chosen=last.length?last:current,spend=chosen.reduce((s,x)=>s+Number(x.amount),0);let period=last.length?'last month':current.length?'this month so far':'no recorded expenses';let deduction=commitmentsInExpenses?0:commitments;return {income,commitments,spend,period,hasExpenses:chosen.length>0,available:Math.max(0,income-spend-deduction),net:income-spend-deduction}}
function goalForecast(g,p){let remaining=Math.max(0,Number(g.target)-Number(g.saved));if(remaining===0)return 'Goal reached!';if(!p.income)return 'Add monthly income in Accounts to see an estimate.';if(!p.available)return 'No available savings estimated. Review income, spending and commitments.';let months=Math.ceil(remaining/p.available),d=new Date(),date=new Date(d.getFullYear(),d.getMonth()+months,1);return `About ${months} month${months===1?'':'s'} · around ${date.toLocaleDateString('en-US',{month:'short',year:'numeric'})}`}
function savingsPlanHTML(){let p=planningEstimate();return `<section class="card savings-plan"><div class="cardhead"><div><h3>Your estimated savings plan</h3><p>Based on the income, spending and commitments you entered</p></div><span class="pill">Estimate</span></div><div class="plan-numbers"><div><span>Monthly income</span><b>${money(p.income)}</b></div><div><span>Expenses · ${p.period}</span><b>${money(p.spend)}</b></div><div><span>Monthly commitments</span><b>${money(p.commitments)}</b></div><div><span>Potential monthly savings</span><b>${money(p.available)}</b></div></div>${p.net<0?`<p class="plan-alert">Your estimated expenses exceed income by ${money(-p.net)}.</p>`:''}${!p.income?'<p class="plan-alert">Add your income in Accounts to calculate a savings estimate.</p>':''}${!p.hasExpenses?'<p class="plan-alert">No expenses recorded for the current or previous month, so this estimate may be incomplete.</p>':p.period==='this month so far'?'<p class="plan-alert">No expenses recorded last month. This month is still in progress, so its spending may be incomplete.</p>':''}<label class="overlap-check"><input type="checkbox" id="commitments-in-expenses" ${commitmentsInExpenses?'checked':''}> My recorded expenses already include all my monthly commitments</label><p class="plan-note">${commitmentsInExpenses?'Commitments are not subtracted again.':'Commitments are subtracted separately. If they are already included in expenses, select the option above.'} Each goal estimate assumes all potential savings go to that goal, with a fixed price and steady income and spending.</p></section>`}
function spendingInsights(){let nowItems=monthly(),prevItems=state.expenses.filter(x=>x.date.startsWith(previousMonthKey())),current=nowItems.reduce((a,x)=>a+Number(x.amount),0),prior=prevItems.reduce((a,x)=>a+Number(x.amount),0),groups=new Map();for(let x of nowItems){let name=String(x.category||'Other').trim()||'Other',key=name.toLocaleLowerCase(),g=groups.get(key)||{name,total:0};g.total+=Number(x.amount);groups.set(key,g)}let top=[...groups.values()].sort((a,b)=>b.total-a.total).slice(0,3);let comparison=!prevItems.length?'No transactions recorded last month; a percentage comparison is unavailable.':!prior?'Last month total was zero; a percentage comparison is unavailable.':`${current>prior?'Up':current<prior?'Down':'Unchanged'} ${Math.abs(Math.round((current-prior)/prior*100))}% vs last month${current>prior?' · spending is higher':''}.`;return `<section class="card spending-insights"><div class="cardhead"><div><h3>Spending insights</h3><p>Current month so far compared with last month</p></div><span class="pill">Insights</span></div><div class="insight-totals"><div><span>This month so far</span><b>${money(current)}</b></div><div><span>Last month</span><b>${money(prior)}</b></div></div><p class="insight-comparison">${esc(comparison)}</p>${top.length?`<div class="insight-heading">Top categories this month</div>${top.map((g,i)=>`<div class="insight-category"><span class="insight-rank">${i+1}</span><b>${esc(g.name)}</b><span>${money(g.total)} · ${current?Math.round(g.total/current*100):0}%</span></div>`).join('')}`:'<p class="plan-note">Add expenses to see your top categories.</p>'}<p class="plan-note">This month is incomplete; comparisons can change as you add expenses.</p></section>`}
function budgetAlerts(){let alerts=state.budgets.map(b=>{let spend=monthly().filter(x=>String(x.category).trim().toLocaleLowerCase()===String(b.category).trim().toLocaleLowerCase()).reduce((a,x)=>a+Number(x.amount),0),limit=Number(b.limit),pct=limit>0?spend/limit*100:0;return {b,spend,limit,pct}}).filter(x=>x.pct>=80).sort((a,b)=>b.pct-a.pct);if(!alerts.length)return '';return `<section class="card budget-alerts" aria-label="Budget alerts"><div class="cardhead"><div><h3>Budget alerts</h3><p>Based on this month's recorded expenses</p></div><span class="pill">${alerts.length} alert${alerts.length===1?'':'s'}</span></div>${alerts.map(x=>`<div class="budget-alert ${x.pct>=100?'over':''}"><span aria-hidden="true">${x.pct>=100?'!':'◷'}</span><div><b>${esc(x.b.category)} · ${Math.round(x.pct)}% used</b><small>${x.spend>x.limit?`${money(x.spend-x.limit)} over your limit`:x.spend===x.limit?'You reached your limit':`${money(x.limit-x.spend)} left before your limit`}</small></div><button class="link" onclick="navigate('budgets')">View</button></div>`).join('')}</section>`}
const insightRender=render;render=function(){insightRender();const app=document.getElementById('app');if(page==='goals'){let heading=app.querySelector('.heading');heading.insertAdjacentHTML('afterend',savingsPlanHTML());let checkbox=document.getElementById('commitments-in-expenses');checkbox.addEventListener('change',()=>{commitmentsInExpenses=checkbox.checked;try{localStorage.setItem('montra-commitments-in-expenses',String(commitmentsInExpenses))}catch(e){}render()});let p=planningEstimate();for(let g of state.goals){let btn=app.querySelector(`[onclick="goalForm('${g.id}')"]`);if(!btn)continue;let box=btn.closest('.goalbox');if(box)box.insertAdjacentHTML('beforeend',`<div class="estimated-goal"><span>Based on potential savings</span><b>${esc(goalForecast(goalWithAssets(g),p))}</b></div>`)}}if(page==='overview'){let grid=app.querySelector('.grid');let analytics=grid?.querySelector('.analytics');if(analytics)analytics.insertAdjacentHTML('afterend',spendingInsights());let alerts=budgetAlerts();if(alerts&&grid){let target=grid.querySelector('.overview-budgets');if(target)target.insertAdjacentHTML('beforebegin',alerts);else grid.insertAdjacentHTML('beforeend',alerts)}}if(page==='budgets'){let alerts=budgetAlerts();if(alerts)app.querySelector('.heading').insertAdjacentHTML('afterend',alerts)}};

function assetValue(goalId){return (state.assets||[]).filter(a=>a.goal_id===goalId).reduce((sum,a)=>sum+Number(a.quantity)*Number(a.unit_price),0)}
function goalWithAssets(g){return {...g,saved:Number(g.saved)+assetValue(g.id)}}
function assetSection(){let assets=state.assets||[];return `<section class="card assets-panel"><div class="cardhead"><div><h3>Gold & investments</h3><p>Track assets and assign them to a goal</p></div><button class="inlinebtn" onclick="assetForm()">＋ Add asset</button></div><p class="asset-note">Values are entered and updated by you in ${currencyCode()}. No live prices. Your goal's “already saved” amount should exclude linked assets to avoid counting them twice.</p>${assets.length?`<div class="asset-list">${assets.map(a=>{let goal=state.goals.find(g=>g.id===a.goal_id);return `<div class="asset-item"><div class="asset-icon">${a.kind==='Gold'?'✦':a.kind==='Stock'?'↗':'◈'}</div><div class="asset-text"><b>${esc(a.name)}</b><small>${esc(a.kind)} · ${fmt(a.quantity)} ${esc(a.unit)} × ${money(a.unit_price)}${goal?' · '+esc(goal.name):' · No goal linked'}</small></div><strong>${money(a.quantity*a.unit_price)}${a.previous_unit_price!==null&&a.previous_unit_price!==undefined?`<small class="asset-change">${a.unit_price>a.previous_unit_price?'↑':a.unit_price<a.previous_unit_price?'↓':'−'} ${money(Math.abs((a.unit_price-a.previous_unit_price)*a.quantity))} since last price</small>`:''}</strong><button class="inlinebtn" onclick="assetForm('${a.id}')">Edit</button><button class="delete" onclick="deleteAsset('${a.id}')" aria-label="Delete asset">✕</button></div>`}).join('')}</div>`:'<div class="asset-empty">No assets yet. Add gold, shares, or another asset to track its value.</div>'}</section>`}
function assetForm(id){let a=(state.assets||[]).find(x=>x.id===id)||{};let opts=state.goals.map(g=>`<option value="${esc(g.id)}" ${a.goal_id===g.id?'selected':''}>${esc(g.name)}</option>`).join('');showForm(`<form id="assetform"><h2>${id?'Edit':'Add'} an asset</h2><p>Enter values manually. Prices do not update automatically.</p><label for="asset-name">Asset name</label><input id="asset-name" name="name" required maxlength="80" value="${esc(a.name||'')}" placeholder="e.g. Gold or company name"><div class="formgrid"><div><label for="asset-kind">Asset type</label><select id="asset-kind" name="kind">${['Gold','Stock','Other'].map(t=>`<option ${a.kind===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label for="asset-unit">Unit</label><input id="asset-unit" name="unit" maxlength="30" required value="${esc(a.unit||'')}" placeholder="e.g. grams or shares"></div><div><label for="asset-quantity">Quantity</label><input id="asset-quantity" type="number" name="quantity" min="0.000001" step="any" required value="${a.quantity??''}"></div><div><label for="asset-price">Current price per unit (EGP)</label><input id="asset-price" type="number" name="unit_price" min="0" step="any" required value="${a.unit_price??''}"></div><div class="wide"><label for="asset-goal">Link to goal (optional)</label><select id="asset-goal" name="goal_id"><option value="">No goal</option>${opts}</select></div></div><p class="warning">The linked asset's current value is added to the goal. Do not include it in “already saved”.</p><div class="actions"><button class="secondary" type="button" onclick="closeForm()">Cancel</button><button class="primary">Save asset</button></div></form>`);document.getElementById('assetform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim(),unit=String(f.get('unit')).trim(),quantity=Number(f.get('quantity')),price=Number(f.get('unit_price'));if(!name||!unit||!Number.isFinite(quantity)||quantity<=0||!Number.isFinite(price)||price<0){alert('Enter a name, unit, valid quantity and price.');return}let item={name,unit,quantity,unit_price:price,kind:f.get('kind'),goal_id:f.get('goal_id')||null,market:String(f.get('market')||accountSettings.country_code),symbol:String(f.get('symbol')||'').trim(),previous_unit_price:id?(price!==Number(a.unit_price)?Number(a.unit_price):a.previous_unit_price):null,updated_at:new Date().toISOString()};if(await writeData(()=>id?db.from('montra_assets').update(item).eq('id',id):db.from('montra_assets').insert(item))){closeForm();await loadData()}}}
async function deleteAsset(id){if(confirm('Delete this asset?'))if(await writeData(()=>db.from('montra_assets').delete().eq('id',id)))await loadData()}
function savingSuggestions(){let p=planningEstimate(),prev=previousMonthKey(),prior=state.expenses.filter(x=>x.date.startsWith(prev)),items=prior.length?prior:monthly(),groups=new Map();for(const x of items){let name=String(x.category||'Other').trim()||'Other',key=name.toLocaleLowerCase();let g=groups.get(key)||{name,total:0};g.total+=Number(x.amount);groups.set(key,g)}let list=[...groups.values()].filter(g=>g.total>0).sort((a,b)=>b.total-a.total).slice(0,3),period=prior.length?'last month':'this month so far';return `<section class="card savings-suggestions"><div class="cardhead"><div><h3>Ways to save more</h3><p>Explore possible reductions by category</p></div><span class="pill">What if</span></div>${!list.length?'<p class="asset-note">Add expenses to explore possible savings.</p>':list.map(g=>{let extra=Math.round(g.total*0.1*100)/100;return `<div class="suggestion"><b>${esc(g.name)}</b><span>Try saving 10% of ${money(g.total)} spent ${period}: <strong>${money(extra)}/month</strong></span>${state.goals.length&&p.income?`<div class="suggestion-goals">${state.goals.map(raw=>{let goal=goalWithAssets(raw),remaining=Math.max(0,goal.target-goal.saved),before=p.available>0?Math.ceil(remaining/p.available):null,after=Math.max(0,p.net+extra)>0?Math.ceil(remaining/Math.max(0,p.net+extra)):null;return `<div><span>${esc(goal.name)}</span><b>${remaining===0?'Already reached':after!==null?(before!==null?`${before} → ${after} months`:`No estimate → ${after} months`):'No estimate'}</b></div>`}).join('')}</div>`:'<small>Add income and a goal to estimate the effect on a goal.</small>'}</div>`}).join('')}<p class="asset-note">Illustrations only, not a judgment that spending is unnecessary. Based on ${period}; the current month may be incomplete. Each example assumes a steady monthly reduction and all potential savings go to one goal. Linked asset prices stay fixed.</p></section>`}
const assetsRender=render;render=function(){assetsRender();if(page==='goals'){let app=document.getElementById('app'),plan=app.querySelector('.savings-plan');if(plan)plan.insertAdjacentHTML('afterend',assetSection()+savingSuggestions())}};

loadData=async function(){try{
 const country=user?.user_metadata?.country_code,cur=user?.user_metadata?.base_currency;
 const initial={user_id:user.id,country_code:MONTRA_COUNTRIES.some(c=>c[0]===country)?country:'EG',base_currency:supportedCurrencies.includes(cur)?cur:'EGP',income_currency:supportedCurrencies.includes(cur)?cur:'EGP'};
 const {error:profileError}=await db.from('montra_profiles').upsert(initial,{onConflict:'user_id',ignoreDuplicates:true});if(profileError)throw profileError;
 const result=await Promise.all(['montra_expenses','montra_goals','montra_budgets','montra_profiles','montra_income_sources','montra_commitments','montra_assets'].map(t=>t==='montra_profiles'?db.from(t).select('*').maybeSingle():db.from(t).select('*')));for(const r of result)if(r.error)throw r.error;
 accountSettings={...accountSettings,...result[3].data};const base=currencyCode();const ledger=rows=>(rows||[]).filter(x=>(x.currency||'EGP')===base);
 const availableCurrencies=[...new Set(result.filter((_,i)=>i!==3).flatMap(r=>(r.data||[]).map(x=>x.currency||'EGP')))];
 state={expenses:ledger(result[0].data).map(x=>({...x,date:x.expense_date,amount:Number(x.amount)})),goals:ledger(result[1].data).map(x=>({...x,target:Number(x.target),saved:Number(x.saved),monthly:Number(x.monthly)})),budgets:ledger(result[2].data).map(x=>({...x,limit:Number(x.budget_limit)})),income:(accountSettings.income_currency||'EGP')===base?Number(accountSettings.income||0):0,incomes:ledger(result[4].data).map(x=>({...x,amount:Number(x.amount)})),commitments:ledger(result[5].data).map(x=>({...x,amount:Number(x.amount)})),assets:ledger(result[6].data).map(x=>({...x,quantity:Number(x.quantity),unit_price:Number(x.unit_price),previous_unit_price:x.previous_unit_price===null?null:Number(x.previous_unit_price)})),availableCurrencies};render();await refreshNotifications();await refreshPushStatus();
 }catch(e){document.getElementById('app').innerHTML='<div class="card notice">Could not load your data. Please refresh and try again. '+esc(e.message)+'</div>'}};
incomeForm=function(){showForm(`<form id="incomeform"><h2>Monthly income</h2><p>Enter your usual monthly income in ${esc(currencyCode())}.</p><label for="income-value">Amount (${esc(currencyCode())})</label><input id="income-value" name="income" type="number" min="0" step="0.01" value="${state.income}" required><div class="actions"><button type="button" class="secondary" onclick="closeForm()">Cancel</button><button class="primary">Save income</button></div></form>`);document.getElementById('incomeform').onsubmit=async e=>{e.preventDefault();const income=Number(new FormData(e.target).get('income'));if(await writeData(()=>db.from('montra_profiles').update({income,income_currency:currencyCode()}).eq('user_id',user.id))){closeForm();await loadData()}}};
const regionShowForm=showForm;showForm=function(html){regionShowForm(html.replaceAll('(EGP)','('+currencyCode()+')'));};
async function refreshNotifications(){if(!user)return;const result=await Promise.all([db.from('montra_notifications').select('*').order('created_at',{ascending:false}).limit(100),db.from('montra_notifications').select('id',{head:true,count:'exact'}).is('read_at',null)]);if(result.some(r=>r.error))return;notifications=result[0].data||[];unreadNotifications=result[1].count||0;updateNotificationBell()}
function updateNotificationBell(){const button=document.getElementById('notification-bell');if(button){button.innerHTML=`<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M10 21h4"/></svg><span class="bell-label">Notifications</span>${unreadNotifications?`<span class="bell-count">${unreadNotifications>99?'99+':unreadNotifications}</span>`:''}`;button.setAttribute('aria-label',`Notifications, ${unreadNotifications} unread`)}const code=document.getElementById('ledger-currency');if(code)code.textContent=currencyCode()}
async function openNotifications(){await refreshNotifications();showForm(`<div class="notification-head"><div><h2>Notifications</h2><p>${unreadNotifications} unread · latest 100 updates</p></div><button class="delete" type="button" onclick="closeForm()" aria-label="Close notifications">✕</button></div><button class="link" id="mark-notifications">Mark all as read</button><div class="notification-list">${notifications.length?notifications.map(n=>`<button type="button" class="notification-item ${n.read_at?'':'unread'}" data-notification="${n.id}"><b>${esc(n.title)}</b><span>${esc(n.body)}</span><small>${esc(new Date(n.created_at).toLocaleString())}</small></button>`).join(''):'<div class="empty">No notifications yet. Budget warnings, goal milestones and asset price updates will appear here.</div>'}</div><p class="plan-note">Automatic gold references and configured stock sources can generate price-change alerts. Check each asset’s source and quote time.</p>`);document.getElementById('mark-notifications').onclick=async()=>{const {error}=await db.from('montra_notifications').update({read_at:new Date().toISOString()}).is('read_at',null);if(error){alert('Could not mark notifications as read.');return}await openNotifications()};document.querySelectorAll('[data-notification]').forEach(button=>button.onclick=async()=>{const n=notifications.find(n=>n.id===button.dataset.notification);if(!n)return;const {error}=await db.from('montra_notifications').update({read_at:new Date().toISOString()}).eq('id',n.id);if(error){alert('Could not mark notification as read.');return}closeForm();await refreshNotifications();navigate(n.destination)})}
async function refreshPushStatus(){if(!user)return;try{const {data,error}=await db.functions.invoke('montra-notifications');if(error)throw error;pushService=data;if('serviceWorker' in navigator){const registration=await navigator.serviceWorker.getRegistration('/');pushSubscribed=Boolean(await registration?.pushManager.getSubscription())}}catch{pushService={pushReady:false,emailReady:false,publicKey:''}}if(page==='settings')render()}
function settingsPage(){return header('Settings','Make Montra work for you.','')+`<div class="settings-layout"><section class="card"><div class="cardhead"><div><h3>Country & currency</h3><p>Your account and market preferences</p></div></div><form id="region-settings"><label for="settings-country">Country</label><select name="country_code" id="settings-country">${countryOptions(accountSettings.country_code)}</select><label for="settings-currency">Base currency</label><select name="base_currency" id="settings-currency">${currencyOptions(currencyCode())}</select><p class="plan-note">Each currency has separate records and totals. Changing this selection does not convert or relabel existing money. Your existing ${(state.availableCurrencies||[]).map(esc).join(', ')||currencyCode()} records stay saved; choose their currency to view them.</p><button class="primary settings-save">Save preferences</button></form><p id="region-status" role="status" class="settings-status"></p><div class="market-note"><b>Preferred market: ${esc(marketName(accountSettings.country_code))}</b><p>You can select a different country or market for each asset. Choose manual or automatic pricing for each asset. Local Egypt gold and stocks require configured providers.</p></div></section><section class="card"><div class="cardhead"><div><h3>Notifications</h3><p>Choose how you receive updates</p></div></div><div class="notification-setting"><div><b>Inside Montra</b><p>Budget warnings, goal milestones and manual asset-price updates. View them using the bell.</p></div><span class="pill">Enabled</span></div><div class="notification-setting"><div><b>Web notifications</b><p>Receive updates on this device even when the page is closed. Browser permission and device support are required.</p></div><button class="inlinebtn" id="push-toggle" ${pushService.pushReady?'':'disabled'}>${pushSubscribed?'Turn off on this device':'Enable on this device'}</button></div><p class="plan-note">${!('PushManager' in window)?'This browser does not support Web Push. On iPhone or iPad, you may need to add Montra to the Home Screen first.':typeof Notification!=='undefined'&&Notification.permission==='denied'?'Notifications are blocked. Allow them in your browser’s site settings.':pushService.pushReady?'Background delivery is checked approximately once per minute. Delivery depends on your device and connection.':'Notification service is loading or unavailable. Try refreshing.'}</p><div class="notification-setting"><div><b>Email notifications</b><p>Use your verified Montra account email.</p></div><label class="email-switch"><input type="checkbox" id="email-notifications" ${accountSettings.email_notifications?'checked':''} ${pushService.emailReady?'':'disabled'}> Enable</label></div>${pushService.emailReady?'':'<p class="plan-note">Email delivery is not configured yet. A verified sender and email provider are required.</p>'}<button class="inlinebtn settings-save" id="test-notification">Send test notification</button><p id="notification-status" class="settings-status" role="status"></p></section></div>`}

function bindSettings(){document.getElementById('region-settings').onsubmit=async e=>{e.preventDefault();const data=new FormData(e.target),country=String(data.get('country_code')),currency=String(data.get('base_currency'));if(!MONTRA_COUNTRIES.some(c=>c[0]===country)||!supportedCurrencies.includes(currency)){document.getElementById('region-status').textContent='Choose a valid country and currency.';return}const {error}=await db.from('montra_profiles').update({country_code:country,base_currency:currency}).eq('user_id',user.id);if(error){document.getElementById('region-status').textContent='Could not save preferences. Please try again.';return}selectedTxCategory=null;txFilters={q:'',category:'',method:'',month:'',order:'newest'};await loadData();const el=document.getElementById('region-status');if(el)el.textContent='Preferences saved. Existing amounts were not converted.'};document.getElementById('push-toggle').onclick=()=>pushSubscribed?disablePush():enablePush();document.getElementById('email-notifications').onchange=async e=>{const enabled=e.target.checked;if(enabled&&!pushService.emailReady){e.target.checked=false;return}const {error}=await db.from('montra_profiles').update({email_notifications:enabled}).eq('user_id',user.id);if(error){e.target.checked=!enabled;settingsMessage('Could not save email preference.');return}accountSettings.email_notifications=enabled;settingsMessage('Email preference saved.')};document.getElementById('test-notification').onclick=async()=>{const {error}=await db.rpc('montra_test_notification');if(error){settingsMessage(error.message);return}await refreshNotifications();settingsMessage('Test added to your notification bell. If this device is subscribed, allow up to a minute for the Web Push.')};}

function readPurchaseDetails(f){const raw=f.elements.purchase_price.value.trim(),fees=f.elements.purchase_fees.value.trim(),date=f.elements.purchase_date.value;const price=raw===''?null:Number(raw),fee=fees===''?0:Number(fees);if((price!==null&&(!Number.isFinite(price)||price<0||price>=1e15))||!Number.isFinite(fee)||fee<0||fee>=1e15){alert('Enter a valid non-negative purchase price and total fees.');return null}if(price===null&&(fee>0||date)){alert('Enter the purchase price, or clear the purchase date and fees.');return null}if(date&&date>localPurchaseDate()){alert('Purchase date cannot be in the future.');return null}return {purchase_price:price,purchase_fees:fee,purchase_date:date||null};}

function investmentStatus(a){if(!a.quote_source||a.quote_source==='manual')return {label:'Manual price',detail:'Updated by you',warn:false};if(!a.price_updated_at)return {label:a.quote_status==='error'||a.quote_status==='unavailable'?'Price unavailable':'Fetching first price',detail:a.quote_note||'Your first price is being requested now.',warn:true};const age=Date.now()-Date.parse(a.price_updated_at),old=a.quote_source==='twelve_data'?a.quote_status==='closed'?age>7*86400000:age>3600000:age>1800000;const warn=old||['stale','error','unavailable'].includes(a.quote_status);return {label:warn?'Last saved price':a.quote_status==='closed'?'Market closed':'Latest saved quote',detail:a.quote_source==='twelve_data'?'Last available provider quote; exchange delays may apply.': 'International reference, not an Egypt shop or buyback price.',warn};}

function investmentHolding(a){const p=MontraInvestments.position(a),status=investmentStatus(a),g=state.goals.find(x=>x.id===a.goal_id);return `<article class="card investment-holding"><div class="investment-top"><div class="asset-icon">${a.kind==='Gold'?'✦':a.kind==='Stock'?'↗':'◈'}</div><div class="investment-name"><h3>${esc(a.name)}</h3><p>${esc(a.kind)}${a.kind==='Gold'&&a.quote_source!=='manual'?' · '+a.gold_karat+'K':''}${a.symbol?' · '+esc(a.symbol):''} · ${esc(marketName(a.market))}</p></div><button class="inlinebtn" onclick="assetForm('${a.id}')">Edit</button><button class="delete" onclick="deleteAsset('${a.id}')" aria-label="Delete ${esc(a.name)}">✕</button></div><div class="investment-value"><span>Current holding value</span><strong>${p.value===null?'Awaiting quote':money(p.value)}</strong><small>${fmt(a.quantity)} ${esc(a.unit)}${p.value===null?'':' × '+money(a.unit_price)+' / unit'}</small></div><div class="investment-cost"><div><span>Total purchase cost</span><b>${p.cost===null?'Not entered':money(p.cost)}</b></div><div><span>Unrealized profit / loss</span>${investmentGain(p)}</div></div><div class="investment-meta">${a.purchase_date?`<span>Purchased ${esc(a.purchase_date)}</span>`:''}${Number(a.purchase_fees)>0?`<span>Includes ${money(a.purchase_fees)} purchase fees</span>`:''}<span>${g?`Linked goal: <button class="link" onclick="navigate('goals')">${esc(g.name)}</button>`:'No goal linked'}</span></div><div class="investment-footer"><span class="pill ${status.warn?'investment-warning':''}">${esc(status.label)}</span><p>${esc(sourceLabel(a.quote_source||'manual'))} · ${esc(status.detail)}</p><small>${a.quote_source==='manual'||!a.quote_source?'Updated: '+esc(marketDate(a.updated_at)):'Quote: '+esc(marketDate(a.price_updated_at))}${a.fx_updated_at?' · FX: '+esc(marketDate(a.fx_updated_at)):''}</small>${a.quote_note&&status.warn?`<p>${esc(a.quote_note)}</p>`:''}${a.quote_source&&a.quote_source!=='manual'?`<small>Alert at ±${fmt(a.alert_percent||2)}%; at most once per hour.</small>`:''}</div></article>`;}
function investmentsPage(){const assets=state.assets||[],t=MontraInvestments.portfolio(assets),gain={gain:t.comparable?t.gain:null,known:t.unknown<assets.length,percent:t.comparableCost>0?t.gain/t.comparableCost*100:null};return header('Investments','Your holdings, their value, and the goals they support.','<button class="primary" onclick="assetForm()">＋ Add asset</button>')+`<div class="investment-summary"><section class="card investment-stat investment-total"><span>Portfolio value · ${esc(currencyCode())}</span><h2>${money(t.value)}</h2><small>${assets.length} holding${assets.length===1?'':'s'}${t.pending?' · '+t.pending+' awaiting valuation':''}</small></section><section class="card investment-stat"><span>Recorded purchase cost</span><h2>${assets.length&&t.unknown===assets.length?'—':money(t.cost)}</h2><small>${t.unknown?t.unknown+' holding(s) without purchase cost':'Including purchase fees'}</small></section><section class="card investment-stat"><span>Unrealized profit / loss</span><div class="investment-stat-gain">${investmentGain(gain)}</div><small>${t.comparable} of ${assets.length} holdings have both cost and value</small></section></div><p class="investment-explainer">Totals use your ${esc(currencyCode())} ledger only. Profit / loss compares current reference value with purchase cost plus fees; it excludes dividends, taxes and selling costs. Pending valuations are excluded from portfolio value. Saved prices may be delayed.</p><div class="investment-grid">${assets.length?assets.map(investmentHolding).join(''):'<section class="card investment-empty"><span>↗</span><h3>Your portfolio starts here</h3><p>Add gold, shares or another holding. Purchase details are optional.</p><button class="inlinebtn" onclick="assetForm()">Add your first asset</button></section>'}</div><details class="card investment-reference"><summary>Gold reference prices & sources</summary>${goldReferenceHTML()}</details><p class="plan-note">Holdings are records, not trades. Gold values exclude shop premiums and resale deductions. Egyptian stock prices require an eligible data provider.</p><button class="link" onclick="loadData()">↻ Refresh saved valuations</button>`;}
assetSection=function(){const linked=(state.assets||[]).filter(a=>a.goal_id);return `<section class="card investment-goal-link"><div><h3>Your investments support your goals</h3><p>${linked.length} linked holding${linked.length===1?'':'s'}. Manage holdings, purchase costs and profit / loss in Investments.</p></div><button class="inlinebtn" onclick="navigate('investments')">View investments ↗</button></section>`;};
const investmentRender=render;render=function(){investmentRender();if(page==='investments'){document.getElementById('app').innerHTML=investmentsPage();document.getElementById('crumb').textContent='Investments';}};

const sandboxShares=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:8});let sandboxInfo={ready:false,loaded:false,quoteReady:false},sandboxOrders=[];
async function sandboxCall(action,values={}){const {data,error}=await db.functions.invoke('montra-paypal-sandbox',{body:{action,...values}});if(error){let message=data?.error;try{message=message||(await error.context?.json())?.error}catch{}throw new Error(message||'Could not reach the PayPal Sandbox service. Please retry.')}if(data?.error)throw new Error(data.error);return data;}
const sandboxLoadData=loadData;loadData=async function(){await sandboxLoadData();if(!user)return;try{const [info,orders]=await Promise.all([sandboxCall('status'),db.from('montra_sandbox_orders').select('*').order('created_at',{ascending:false}).limit(30)]);sandboxInfo={...info,loaded:true};if(orders.error)throw orders.error;sandboxOrders=orders.data||[];if(page==='investments'&&!document.getElementById('modal').open)render()}catch{sandboxInfo={ready:false,loaded:true,quoteReady:false};if(page==='investments')render()}};
function sandboxOrderHTML(o){const goal=state.goals.find(g=>g.id===o.goal_id),filled=o.status==='simulated_filled',equivalent=Number(o.amount_usd)*Number(o.fx_rate);return `<article class="sandbox-order"><div><b>${esc(o.symbol)} <span class="pill">${filled?'Simulated fill':o.status==='review'?'Review saved':'Awaiting PayPal confirmation'}</span></b><p>USD ${fmt(o.amount_usd)} test funds · ${sandboxShares(o.quantity)} simulated shares at USD ${fmt(o.quote_usd)}</p><small>${esc(marketDate(o.created_at))} · Quote: ${esc(marketDate(o.quote_time))}</small>${goal?`<p>Goal: ${esc(goal.name)} · test holding cost equivalent ${esc(o.ledger_currency)} ${fmt(equivalent)}${goal.target>0?' ('+fmt(equivalent/goal.target*100)+'% of target)':''}. Excluded from actual progress.</p>`:''}${filled?'<p>Sandbox payment verified. The fill uses the review price and fractional shares for demonstration, with zero simulated fees. No broker order or real share ownership.</p>':''}</div><div>${filled?'<span class="pill">Demo only</span>':`<button class="inlinebtn" onclick="reviewSandboxOrder('${o.id}')">${o.paypal_order_id?'Review / confirm':'View review'}</button>`}</div></article>`;}
function sandboxSection(){const params=new URLSearchParams(location.search),returned=params.has('paypal_demo'),cancelled=params.has('paypal_cancel');return `<section class="card sandbox-panel"><div class="cardhead"><div><h3>Try a goal investment</h3><p>PayPal Sandbox payment + simulated stock purchase</p></div><span class="pill">Test mode</span></div><p class="sandbox-notice">Use test funds only. This demonstration does not buy securities or change your real holdings, expenses or goal savings. Share prices are used for illustration; no return is promised.</p>${returned?'<p class="sandbox-notice">Returned from PayPal. Open the matching review below to verify the payment and create the simulated fill.</p>':''}${cancelled?'<p class="sandbox-notice">You returned through Cancel. No payment is assumed successful and no holding was added. You may review the order again.</p>':''}<div class="sandbox-status"><span>${!sandboxInfo.loaded?'Checking PayPal Sandbox configuration…':sandboxInfo.ready?'PayPal Sandbox configured':'PayPal Sandbox is not configured yet'}</span>${sandboxInfo.loaded&&!sandboxInfo.ready?'<p>Payment requires the Sandbox app Client ID and Secret. You can still request a stock-price review when the price service is available.</p>':''}</div><button class="inlinebtn" onclick="sandboxForm()" ${sandboxInfo.quoteReady?'':'disabled'}>Preview a demo investment</button><p class="plan-note">First version: US stocks, payment in USD test funds. Egypt stock trading and live payments are not connected. Displayed currency equivalents use a reference exchange rate, not a PayPal conversion quote.</p>${sandboxOrders.length?`<div class="sandbox-orders"><h4>Recent demo reviews & payments</h4>${sandboxOrders.map(sandboxOrderHTML).join('')}</div>`:''}</section>`;}
const sandboxInvestmentsPage=investmentsPage;investmentsPage=function(){return sandboxInvestmentsPage()+sandboxSection()};
function sandboxForm(){showForm(`<form id="sandbox-form"><h2>Preview a demo investment</h2><p>Choose a US stock and an amount of test USD. This is not an investment recommendation or a real trade.</p><label for="sandbox-symbol">US stock symbol</label><input id="sandbox-symbol" name="symbol" required maxlength="30" placeholder="e.g. AAPL"><label for="sandbox-amount">Test payment amount (USD)</label><input id="sandbox-amount" name="amount_usd" type="number" min="1" max="10000" step="0.01" required placeholder="e.g. 10.00"><label for="sandbox-goal">Goal for the demonstration (optional)</label><select id="sandbox-goal" name="goal_id"><option value="">No goal</option>${state.goals.map(g=>`<option value="${esc(g.id)}">${esc(g.name)} (${esc(currencyCode())})</option>`).join('')}</select><p class="sandbox-notice">Fractional-share simulation only. No real funds or goal savings will be moved.</p><p id="sandbox-message" role="status"></p><div class="actions"><button type="button" class="secondary" onclick="closeForm()">Cancel</button><button class="primary">Get review</button></div></form>`);const f=document.getElementById('sandbox-form');f.onsubmit=async e=>{e.preventDefault();if(!f.reportValidity())return;const button=f.querySelector('button.primary'),message=document.getElementById('sandbox-message');button.disabled=true;message.textContent='Fetching a recent quote…';try{const fields=Object.fromEntries(new FormData(f)),result=await sandboxCall('preview',fields);sandboxOrders=[result.draft,...sandboxOrders].slice(0,30);closeForm();render();reviewSandboxOrder(result.draft.id)}catch(error){message.textContent=error.message;button.disabled=false}};}
function reviewSandboxOrder(id){const o=sandboxOrders.find(x=>x.id===id);if(!o)return;const goal=state.goals.find(g=>g.id===o.goal_id),filled=o.status==='simulated_filled';showForm(`<div class="sandbox-review"><h2>${filled?'Demo purchase recorded':'Review your demo'}</h2><span class="pill">PayPal Sandbox · no real trade</span><dl><div><dt>Test payment</dt><dd>USD ${fmt(o.amount_usd)}</dd></div><div><dt>US stock</dt><dd>${esc(o.symbol)}</dd></div><div><dt>Review price / share</dt><dd>USD ${fmt(o.quote_usd)}</dd></div><div><dt>Simulated quantity</dt><dd>${sandboxShares(o.quantity)} shares</dd></div><div><dt>Quote time</dt><dd>${esc(marketDate(o.quote_time))}</dd></div>${goal?`<div><dt>Goal</dt><dd>${esc(goal.name)}</dd></div>`:''}<div><dt>Reference equivalent</dt><dd>${esc(o.ledger_currency)} ${fmt(Number(o.amount_usd)*Number(o.fx_rate))}</dd></div></dl><p>Simulation uses the review price and fractional shares, with zero simulated fees. This is not an executable broker quote. Actual prices and fees may differ.</p><p class="sandbox-notice">${filled?'PayPal test payment has been verified. Your real portfolio and goal savings are unchanged.':'PayPal approval and completed capture must be verified before a simulated fill is recorded. Cancelling or a failed/pending payment does not create a holding.'}</p>${!filled?`<label class="sandbox-consent"><input type="checkbox" id="sandbox-consent"> I understand this uses PayPal Sandbox test funds and creates a simulated purchase only.</label>`:''}${!filled&&o.approval_url?`<p><a class="auth-link" href="${esc(o.approval_url)}">Reopen PayPal Sandbox approval</a></p>`:''}<p id="sandbox-review-message" role="status"></p><div class="actions"><button class="secondary" onclick="closeForm()">Close</button>${!filled?`<button class="primary" id="sandbox-pay" ${sandboxInfo.ready?'':'disabled'}>${o.paypal_order_id?'Verify payment & simulate':'Continue to PayPal Sandbox'}</button>`:''}</div>${!filled&&!sandboxInfo.ready?'<p>Payment is unavailable until the Sandbox app Client ID and Secret are configured.</p>':''}</div>`);const button=document.getElementById('sandbox-pay');if(button)button.onclick=async()=>{const message=document.getElementById('sandbox-review-message');if(!document.getElementById('sandbox-consent').checked){message.textContent='Confirm the test-mode acknowledgement first.';return}button.disabled=true;message.textContent='Contacting PayPal Sandbox…';try{if(o.paypal_order_id){const result=await sandboxCall('capture',{draft_id:o.id});sandboxOrders=sandboxOrders.map(x=>x.id===o.id?result.draft:x);closeForm();await loadData();reviewSandboxOrder(o.id)}else{const result=await sandboxCall('create',{draft_id:o.id});const url=new URL(result.approval_url);if(url.origin!=='https://www.sandbox.paypal.com')throw new Error('Unexpected PayPal destination');location.assign(url.href)}}catch(error){message.textContent=error.message;button.disabled=false}};}
const sandboxSignOut=signOut;signOut=async function(){sandboxOrders=[];sandboxInfo={ready:false,loaded:false,quoteReady:false};await sandboxSignOut()};

let opportunityItems=[],opportunityMarket='EG',opportunityError='',opportunityLoading=false,opportunityGoal='',opportunityBudget='',opportunityHorizon='short';
function opportunityCards(){if(opportunityMarket==='EG')return '<div class="opportunity-empty"><b>Egyptian stocks: awaiting a data provider</b><p>EGX price coverage is not enabled. Montra cannot currently identify or price Egyptian stock opportunities. Choose the US market to explore the available comparison examples.</p></div>';if(opportunityLoading)return '<p role="status">Loading provider quotes…</p>';if(opportunityError)return `<p class="sandbox-notice" role="status">${esc(opportunityError)}</p>`;if(!opportunityItems.length)return '<p class="plan-note">Load comparison examples to see available prices and risks.</p>';return `<div class="opportunity-grid">${opportunityItems.map(a=>`<article class="opportunity-card"><span class="pill">${esc(a.type)}</span><h4>${esc(a.name||a.symbol)} <small>${esc(a.symbol)}</small></h4><strong>${a.unavailable?'Price unavailable':'USD '+fmt(a.price)}</strong><p>${esc(a.reason)}</p>${a.change_percent!==null&&a.change_percent!==undefined?`<p>Provider session change: ${a.change_percent>0?'+':''}${fmt(a.change_percent)}% · historical movement, not a forecast.</p>`:''}<small>Twelve Data · ${esc(marketDate(a.quote_time))}${a.closed?' · Market closed':''}${a.stale?' · Stale / unavailable':''}</small><button class="inlinebtn" onclick="compareOpportunity('${a.symbol}')" ${a.unavailable||a.stale?'disabled':''}>Compare with my goal</button></article>`).join('')}</div>`;}
function opportunitiesSection(){return `<section class="card opportunities-panel"><div class="cardhead"><div><h3>Explore before you invest</h3><p>Compare market examples and their possible effect on your goal</p></div><span class="pill">Research first</span></div><p class="plan-note">These are fixed examples to research, not a ranked list of buys. A low share price or a recent rise is not proof of value or future gains. We do not yet have a valuation or prediction model.</p><div class="opportunity-inputs"><div><label for="opportunity-market">Market</label><select id="opportunity-market" onchange="opportunityMarket=this.value;render()"><option value="EG" ${opportunityMarket==='EG'?'selected':''}>Egypt · data not connected</option><option value="US" ${opportunityMarket==='US'?'selected':''}>United States · available examples</option></select></div><div><label for="opportunity-goal">Goal to compare</label><select id="opportunity-goal" onchange="opportunityGoal=this.value"><option value="">Select a goal</option>${state.goals.map(g=>`<option value="${esc(g.id)}" ${opportunityGoal===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div><div><label for="opportunity-budget">Amount to explore (${esc(currencyCode())})</label><input id="opportunity-budget" type="number" min="0.01" step="any" value="${esc(opportunityBudget)}" placeholder="Money after essentials & emergency savings" onchange="opportunityBudget=this.value"></div><div><label for="opportunity-horizon">When will you need this money?</label><select id="opportunity-horizon" onchange="opportunityHorizon=this.value;render()"><option value="short" ${opportunityHorizon==='short'?'selected':''}>Within five years</option><option value="long" ${opportunityHorizon==='long'?'selected':''}>More than five years</option></select></div></div>${opportunityHorizon==='short'?'<p class="sandbox-notice">Money needed within five years can be exposed to a loss when you need to withdraw it. This page does not propose funding a short-term goal with an individual stock.</p>':'<p class="plan-note">A longer horizon does not remove loss risk. Compare diversified investments and avoid putting your goal funds into a single company.</p>'}<button class="inlinebtn" onclick="loadOpportunities()" ${opportunityLoading||opportunityMarket!=='US'?'disabled':''}>${opportunityLoading?'Loading…':'Load comparison examples'}</button><div class="opportunity-results">${opportunityCards()}</div><p class="plan-note"><a href="https://www.investor.gov/introduction-investing/getting-started/asset-allocation" target="_blank" rel="noopener">Learn about time horizon, risk and diversification</a>. Prices may be delayed. FX uses a daily reference. No real purchases are made here.</p></section>`;}
async function loadOpportunities(){opportunityLoading=true;opportunityError='';render();try{const result=await sandboxCall('explore');opportunityItems=result.items||[];}catch(e){opportunityError=e.message}finally{opportunityLoading=false;if(page==='investments')render()}}
const discoveryInvestmentsPage=investmentsPage;investmentsPage=function(){return discoveryInvestmentsPage().replace('<div class="investment-summary">',opportunitiesSection()+'<div class="investment-summary">')};
function compareOpportunity(symbol){const a=opportunityItems.find(x=>x.symbol===symbol),goal=state.goals.find(g=>g.id===opportunityGoal),budget=Number(opportunityBudget);if(!goal){alert('Choose the goal you want to compare first.');return}if(!Number.isFinite(budget)||budget<=0){alert('Enter an amount available after your essentials and emergency savings.');return}if(!a||a.unavailable||a.stale||!Number.isFinite(Date.parse(a.quote_time))||Date.now()-Date.parse(a.quote_time)>(a.closed?7*86400000:3600000)){alert('A recent quote is unavailable. Reload the comparison examples.');return}const fx=currencyCode()==='USD'?1:Number(marketFX?.rates?.[currencyCode()]);if(!Number.isFinite(fx)||fx<=0||!marketFX?.updatedAt&&currencyCode()!=='USD'||currencyCode()!=='USD'&&Date.now()-Date.parse(marketFX.updatedAt)>3*86400000){alert('A recent currency reference is unavailable.');return}const saved=Number(goal.saved)+assetValue(goal.id),monthly=Number(goal.monthly||0),quotePrice=Number(a.price)*fx,wholeShares=Math.floor(budget/quotePrice),remaining=Math.max(0,goal.target-saved),baseline=MontraOpportunities.scenario({target:goal.target,saved,monthly,budget,change:0});let near=opportunityHorizon==='short';if(goal.target_date){const deadline=new Date(goal.target_date+'T00:00:00');if(deadline.getTime()-Date.now()<=5*365.25*86400000)near=true;}showForm(`<div class="opportunity-comparison"><h2>${esc(a.symbol)} & your ${esc(goal.name)} goal</h2><p>Research comparison only. The scenarios below are chosen examples, not predictions or probabilities.</p><p><b>${money(budget)}</b> exploration amount · ${wholeShares} whole share${wholeShares===1?'':'s'} at the displayed reference price. Fractional trading depends on your broker. This does not establish that the stock is fairly valued.</p>${near?'<p class="sandbox-notice">Your selected horizon or goal date is within five years. An individual stock could delay this goal. Consider preserving money you need soon.</p>':''}<div class="opportunity-scenarios">${[-20,0,20].map(change=>{const x=MontraOpportunities.scenario({target:goal.target,saved,monthly,budget,change});return `<div><b>${change>0?'+':''}${change}% hypothetical change</b><span>Investment value: ${money(x.value)}</span><span>Gain / loss: ${x.gain>0?'+':x.gain<0?'−':''}${money(Math.abs(x.gain))}</span><span>${x.scenarioMonths===null?'Add a monthly saving to compare duration':`Savings-equivalent duration: ${x.scenarioMonths} months`}</span></div>`}).join('')}</div><p>Baseline: ${baseline.baselineMonths===null?'no monthly savings entered':baseline.baselineMonths+' months'} at ${money(monthly)}/month, with ${money(remaining)} remaining. Only hypothetical gain or loss is applied to the remaining gap; the principal is not added again. The illustration assumes the exploration amount is already included in your saved balance. This is a sensitivity illustration, assumes immediate realization, and ignores fees, taxes and future price changes. Losses can exceed 20%.</p><p>No cash, portfolio or goal balance has changed. The amount is self-reported and has not been verified as available.</p><div class="actions"><button class="secondary" onclick="closeForm()">Close</button><button class="primary" onclick="opportunityDemo('${esc(a.symbol)}',${budget/fx})">Explore a Sandbox demo</button></div></div>`);}
function opportunityDemo(symbol,usd){closeForm();sandboxForm();const f=document.getElementById('sandbox-form');f.elements.symbol.value=symbol;f.elements.goal_id.value=opportunityGoal;f.elements.amount_usd.value=usd.toFixed(2);}
const discoverySignOut=signOut;signOut=async function(){opportunityItems=[];opportunityGoal='';opportunityBudget='';opportunityHorizon='short';await discoverySignOut()};

if(!db){authScreen('Could not load the secure sign-in service. Check your connection and refresh.');document.querySelector('#authform').remove()}else{recovery=location.hash.includes('type=recovery')||new URLSearchParams(location.search).get('reset')==='1';db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;authScreen('','reset')}});db.auth.getSession().then(({data})=>recovery?(data.session?authScreen('','reset'):authScreen('This reset link is invalid or expired. Request a new one.','forgot')):data.session?enterApp():authScreen()).catch(()=>authScreen('Connection failed. Please refresh.'))}</script></body></html>
