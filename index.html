const KEY='montra-real-v1';let state={expenses:[],goals:[],budgets:[],income:0};let user=null;const db=window.supabase?.createClient('https://wkulplqfmjbjgszgofva.supabase.co','sb_publishable_s9CY190ISRusDgva0-0f5g_n9rk3x9N');let busy=false;let page='overview';const CATS=['Food & drinks','Groceries','Transportation','Shopping','Bills','Subscriptions','Health','Entertainment','Education','Other'];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});const money=n=>'EGP '+fmt(n);const now=()=>new Date().toISOString().slice(0,10);const month=()=>now().slice(0,7);const monthly=()=>state.expenses.filter(x=>x.date.startsWith(month()));const total=()=>monthly().reduce((a,x)=>a+x.amount,0);const persist=()=>render();function categories(){return CATS.map(c=>`<option>${esc(c)}</option>`).join('')}function header(t,s,action='<button class="primary" onclick="expenseForm()">＋ &nbsp; Add expense</button>'){return `<div class="heading"><div><h1>${t}</h1><p>${s}</p></div>${action}</div>`}function expensesHTML(limit){let list=[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date));if(limit)list=list.slice(0,limit);return list.length?list.map(x=>`<div class="tx"><div class="tx-icon">${x.category==='Food & drinks'?'☕':'✦'}</div><div class="tx-text"><b>${esc(x.merchant)}</b><small>${esc(x.category)} · ${esc(x.method)} · ${esc(x.date)}${x.note?' · '+esc(x.note):''}</small></div><div class="amount">− ${money(x.amount)}</div><button class="delete" onclick="deleteItem('expenses','${x.id}')" aria-label="Delete expense">✕</button></div>`).join(''):'<div class="empty">No expenses yet. Add your first one ♡</div>'}function goalHTML(){return state.goals.length?`<div class="goal-grid">${(page==='overview'?state.goals.slice(0,2):state.goals).map(g=>{let pct=Math.min(100,g.saved/g.target*100),remaining=Math.max(0,g.target-g.saved),m=g.monthly>0?Math.ceil(remaining/g.monthly):null;return `<div class="goalbox"><div class="goal-top"><div class="goal-icon">◎</div><div><b>${esc(g.name)}</b><span>Personal savings goal</span></div><strong>${Math.round(pct)}%</strong><button class="delete" onclick="deleteItem('goals','${g.id}')" aria-label="Delete goal">✕</button></div><div class="bar"><i style="width:${pct}%"></i></div><div class="barline"><span>${money(g.saved)} saved</span><span>${money(g.target)} goal</span></div><p class="warning">${remaining===0?'Goal reached!':m!==null?'About '+m+' month'+(m===1?'':'s')+' at '+money(g.monthly)+'/month.':'Add monthly savings for a time estimate.'} Estimates assume a fixed goal price.</p><button class="inlinebtn" onclick="goalForm('${g.id}')">Edit goal</button></div>`}).join('')}</div>`:'<div class="empty">No goals yet. Dream big and create one ♡</div>'}function budgetHTML(){return state.budgets.length?state.budgets.map(b=>{let spend=monthly().filter(x=>x.category===b.category).reduce((a,x)=>a+x.amount,0),pct=Math.min(100,spend/b.limit*100);return `<div class="budgetitem"><div class="budget-row"><b>${esc(b.category)}</b><span>${money(spend)} / ${money(b.limit)} <button class="delete" onclick="deleteItem('budgets','${b.id}')" aria-label="Delete budget">✕</button></span></div><div class="bar"><i style="width:${pct}%"></i></div><span class="warning">${spend>=b.limit?'Limit reached or exceeded':pct>=80?'Nearly there · '+money(b.limit-spend)+' left':money(b.limit-spend)+' left this month'}</span></div>`}).join(''):'<div class="empty">No category limits yet. Add one to get started.</div>'}function render(){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.querySelector('#crumb').textContent=({overview:'Overview',transactions:'Transactions',budgets:'Budgets',goals:'My goals',accounts:'Accounts'})[page];let html='';if(page==='overview'){let available=state.income-total();html=header('Your money, in motion ✨','Your spending and goals, ass="cardhead"><div><h3>Monthly limits</h3><p>Based on the current calendar month</p></div></div>${budgetHTML()}</div>`;if(page==='accounts')html=header('Your money setup','Choose how you want to track your money.','')+`<div class="card"><div class="settings-row"><b>Monthly income</b><p>Used to calculate income minus spending on your overview.</p><button class="inlinebtn" onclick="incomeForm()">Edit income · ${money(state.income)}</button></div><div class="settings-row"><b>Cash</b><p>Add purchases manually, including the store or restaurant name.</p><button class="inlinebtn" onclick="expenseForm()">Add expense</button></div><div class="settings-row"><b>PayPal</b><p>PayPal is not connected yet. You can enter PayPal payments manually while integration and permissions are verified.</p></div><p class="warning">Your entries are saved to your Montra account. PayPal payments are currently entered manually.</p></div>`;document.querySelector('#app').innerHTML=html}function navigate(p){page=p;render();window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));const modal=document.querySelector('#modal');function showForm(content){document.querySelector('#formContent').innerHTML=content;modal.showModal()}function closeForm(){modal.close()}function expenseForm(){showForm(`<form id="expform"><h2>Add an expense</h2><p>Tell us where your money went.</p><label>Restaurant, store or recipient</label><input name="merchant" required maxlength="80" placeholder="e.g. Starbucks or McDonald's"><div class="formgrid"><div><label>Amount (EGP)</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></div><div><label>Date</label><input name="date" type="date" value="${now()}" required></div><div><label>Payment method</label><select name="method"><option>Cash</option><option>PayPal</option></select></div><div><label>Category</label><select name="category" onchange="document.getElementById('otherbox').style.display=this.value==='Other'?'block':'none'">${categories()}</select></div><div id="otherbox" class="wide" style="display:none"><label>What category?</label><input name="other" maxlength="40" placeholder="e.g. Pets"></div><div class="wide"><label>Note (optional)</label><input name="note" maxlength="100" placeholder="Add a note"></div></div><p class="warning">PayPal entries are manual; automatic connection is not available yet.</p><div class="actions"><button class="secondary" type="button" onclick="closeForm()">Cancel</button><button class="primary">Save expense</button></div></form>`);document.querySelector('#expform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),cat=f.get('category');if(cat==='Other'&&!String(f.get('other')).trim()){alert('Please enter your category.');return}let item={merchant:String(f.get('merchant')).trim(),amount:Number(f.get('amount')),expense_date:f.get('date'),method:f.get('method'),category:cat==='Other'?String(f.get('other')).trim():cat,note:String(f.get('note')).trim()};if(await writeData(()=>db.from('montra_expenses').insert(item))){closeForm();await loadData()}}}function goalForm(id){let g=state.goals.find(x=>x.id===id)||{};showForm(`<form id="goalform"><h2>${id?'Edit':'Create'} your goal</h2><p>Make a plan for something that matters to you.</p><label>Goal name</label><input name="name" value="${esc(g.name||'')}" maxlength="80" required placeholder="e.g. My dream car"><label>Target amount (EGP)</label><input name="target" type="number" min="0.01" step="0.01" value="${g.target||''}" required><label>Already saved for this goal (EGP)</label><input name="saved" type="number" min="0" step="0.01" value="${g.saved??0}" required><label>Planned monthly savings (EGP)</label><input name="monthly" type="number" min="0" step="0.01" value="${g.monthly??0}" required><div class="actions"><button class="secondary" type="button" onclick="closeForm()">Cancel</button><button class="primary">Save goal</button></div></form>`);document async function loadData(){try{let results=await Promise.all([db.from('montra_expenses').select('*'),db.from('montra_goals').select('*'),db.from('montra_budgets').select('*'),db.from('montra_profiles').select('*').maybeSingle()]);for(const r of results)if(r.error)throw r.error;state={expenses:results[0].data.map(x=>({...x,date:x.expense_date,amount:Number(x.amount)})),goals:results[1].data.map(x=>({...x,target:Number(x.target),saved:Number(x.saved),monthly:Number(x.monthly)})),budgets:results[2].data.map(x=>({...x,limit:Number(x.budget_limit)})),income:Number(results[3].data?.income||0)};render()}catch(e){document.getElementById('app').innerHTML='<div class="card notice">Could not load your data. Please refresh and try again. '+esc(e.message)+'</div>'}}

function authScreen(message='',mode=authMode){authMode=mode;document.querySelector('.shell').style.display='none';document.querySelector('.mobile-nav').style.display='none';let panel=document.getElementById('authscreen');if(!panel){panel=document.createElement('div');panel.id='authscreen';document.body.appendChild(panel)}let config={signin:['Welcome back','Your money goals are waiting for you.','Sign in'],signup:['Let’s get started','Create your account and make space for your goals.','Create account'],forgot:['Forgot your password?','We’ll send a password reset link to your email.','Send reset link'],reset:['Set a new password','Choose a new password to secure your account.','Update password']}[mode];let email=mode!=='reset',password=mode==='signin'||mode==='signup'||mode==='reset';panel.innerHTML=`<div class="auth-wrap"><section class="auth-story"><div class="auth-brand"><div class="logo-circle"><img src="logo.png" alt=""></div> montra</div><div><h1>A little clarity.<br><em>A lot more possibility.</em></h1><p>Bring your spending, budgets, and goals together, and make every step toward your future feel a little easier.</p><div class="auth-steps"><span>✦ Know your spending</span><span>✦ Plan your goals</span><span>✦ Move forward</span></div></div><p style="font-size:12px">Your money, your goals, your way. ♡</p></section><main class="auth-main"><button type="button" class="theme-toggle auth-theme-toggle" onclick="toggleTheme()" aria-label="Switch color theme"></button><div class="auth-card"><h2>${config[0]}</h2><p class="intro">${config[1]}</p><div class="auth-message" id="authmsg" role="status">${esc(message)}</div><form id="authform">${mode==='signup'?'<label for="auth-name">Full name</label><input id="auth-name" type="text" name="full_name" required maxlength="80" autocomplete="name" placeholder="Your full name">':''}${email?'<label for="auth-email">Email address</label><input id="auth-email" type="email" name="email" placeholder="you@example.com" required autocomplete="email">':''}${password?`<div class="pwrow"><label for="auth-password">${mode==='reset'?'New password':'Password'}</label>${mode==='signin'?'<button type="button" class="auth-link" onclick="authScreen(&quot;&quot;,&quot;forgot&quot;)">Forgot password?</button>':''}</div><input id="auth-password" type="password" name="password" placeholder="At least 6 characters" required minlength="6" autocomplete="${mode==='signin'?'current-password':'new-password'}">`:''}${mode==='reset'||mode==='signup'?'<label for="auth-confirm">Confirm password</label><input id="auth-confirm" type="password" name="confirm" required minlength="6" autocomplete="new-password" placeholder="Repeat your new password">':''}<button class="primary wide-btn" type="submit">${config[2]} &nbsp; →</button></form>${mode==='signin'?'<p class="subtle">New here? <button class="auth-link" onclick="authScreen(&quot;&quot;,&quot;signup&quot;)">Create an account</button></p>':mode==='signup'?'<p class="subtle">Already have an account? <button class="auth-link" onclick="authScreen(&quot;&quot;,&quot;signin&quot;)">Sign in</button></p>':'<div class="auth-back"><button class="auth-link" onclick="authScreen(&quot;&quot;,&quot;signin&quot;)">← Back to sign in</button></div>'}<div class="auth-note">A calmer way to manage your money. ♡</div></div></main></div>`;updateThemeButtons();document.getElementById('authform').onsubmit=async e=>{e.preventDefault();await authAction(mode)}}
async function authAction(mode){let form=document.getElementById('authform');if(!form.reportValidity())return;let f=new FormData(form),email=String(f.get('email')||'').trim(),password=String(f.get('password')||''),msg=document.getElementById('authmsg'),button=form.querySelector('button[type=submit]');if((mode==='reset'||mode==='signup')&&password!==f.get('confirm')){msg.textContent='Passwords do not match. Please try again.';return}button.disabled=true;msg.textContent='Please wait…';try{let result;let fullName=String(f.get('full_name')||'').trim();if(mode==='signup'&&!fullName){msg.textContent='Please enter your name.';return}if(mode==='signup')result=await db.auth.signUp({email,password,options:{data:{full_name:fullName},emailRedirectTo:location.origin+'/'} });else if(mode==='forgot')result=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/?reset=1'});else if(mode==='reset')result=await db.auth.updateUser({password});else result=await db.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(mode==='forgot'){msg.textContent='If an account exists, a reset email will be sent. Please check your inbox and spam folder.';return}if(mode==='reset'){recovery=false;history.replaceState(null,'',location.pathname);await db.auth.signOut();authScreen('Your password has been updated. Please sign in.','signin');return}if(mode==='signup'&&!result.data.session){msg.textContent='Check your email to confirm your account, then come back and sign in.';return}await enterApp()}catch(e){msg.textContent=e.message==='Invalid login credentials'?'Email or password is incorrect. New to Montra? Create an account first.':e.message}finally{if(button.isConnected)button.disabled=false}}
async function enterApp(){let {data,error}=await db.auth.getUser();if(error||!data.user){authScreen();return}user=data.user;document.querySelector('.shell').style.display='';document.querySelector('.mobile-nav').style.display='';document.getElementById('authscreen')?.remove();document.getElementById('who').textContent=user.user_metadata?.full_name||user.email||'Your account';await loadData()}

expensesHTML=function(limit){let list=[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date)||(b.created_at||'').localeCompare(a.created_at||''));if(limit)list=list.slice(0,limit);return list.length?list.map(txRow).join(''):'<div class="empty">No expenses yet. Add your first one ♡</div>'};
function renderTxResults(){let list=[...state.expenses].filter(x=>{let q=txFilters.q.trim().toLocaleLowerCase(),cat=String(x.category||'Other').trim().toLocaleLowerCase();return (!q||[x.merchant,x.category,x.note].some(v=>String(v||'').toLocaleLowerCase().includes(q)))&&(!txFilters.category||cat===txFilters.category.trim().toLocaleLowerCase())&&(!selectedTxCategory||cat===selectedTxCategory)&&(!txFilters.method||x.method===txFilters.method)&&(!txFilters.month||x.date.startsWith(txFilters.month))}).sort((a,b)=>{if(txFilters.order==='highest')return b.amount-a.amount||b.date.localeCompare(a.date);if(txFilters.order==='lowest')return a.amount-b.amount||b.date.localeCompare(a.date);return txFilters.order==='oldest'?a.date.localeCompare(b.date):b.date.localeCompare(a.date)||(b.created_at||'').localeCompare(a.created_at||'')});let el=document.getElementById('tx-results');if(!el)return;let sum=list.reduce((a,x)=>a+x.amount,0);document.getElementById('tx-count').textContent=`${list.length} transaction${list.length===1?'':'s'} · ${money(sum)}`;if(!list.length){el.className='';el.innerHTML='<div class="empty">No transactions found. Try changing your filters or add an expense.</div>';return}if(selectedTxCategory){el.className='tx-detail-list';el.innerHTML=list.map(txRow).join('');return}let groups=new Map();for(const x of list){let name=String(x.category||'Other').trim()||'Other',key=name.toLocaleLowerCase();if(!groups.has(key))groups.set(key,{name,items:[],total:0});let group=groups.get(key);group.items.push(x);group.total+=x.amount}el.className='tx-category-cards';el.innerHTML=[...groups.entries()].map(([key,g])=>`<button type="button" class="tx-category-card" data-category-key="${esc(key)}"><span class="category-icon">${key==='food & drinks'?'☕':'✦'}</span><span class="category-card-title">${esc(g.name)}</span><span class="category-card-amount">${money(g.total)}</span><span class="category-card-bottom">${g.items.length} transaction${g.items.length===1?'':'s'} <span aria-hidden="true">↗</span></span></button>`).join('');el.querySelectorAll('.tx-category-card').forEach(card=>card.addEventListener('click',()=>{selectedTxCategory=card.dataset.categoryKey;render();window.scrollTo(0,0)}))}
function transactionPage(){let categoryName=selectedTxCategory?(state.expenses.find(x=>String(x.category||'Other').trim().toLocaleLowerCase()===selectedTxCategory)?.category||selectedTxCategory):null;return header(categoryName?esc(categoryName):'Your transactions',categoryName?'Explore transactions in this category.':'See where your money goes — down to the restaurant or store.')+`<div class="card">${categoryName?'<button type="button" class="link tx-back" id="tx-back">← Back to categories</button>':''}<div class="cardhead"><div><h3>${categoryName?esc(categoryName)+' activity':'Spending by category'}</h3><p>${categoryName?'Search and explore your expenses':'Choose a category to see its transactions'}</p></div><span class="pill" id="tx-count"></span></div><div class="filter-grid ${categoryName?'tx-detail-filters':''}"><label class="search-label">Search<input id="tx-search" placeholder="Search merchant, category or note" value="${esc(txFilters.q)}"></label>${categoryName?'':`<label>Category<select id="tx-category">${optionHTML(allCategories(),txFilters.category,'All categories')}</select></label>`}<label>Payment<select id="tx-method">${optionHTML(['Cash','PayPal'],txFilters.method,'All methods')}</select></label><label>Month<input id="tx-month" type="month" value="${esc(txFilters.month)}"></label><label>Sort<select id="tx-order"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="highest">Highest amount</option><option value="lowest">Lowest amount</option></select></label></div><button class="link clear-filters" id="clear-filters">Clear filters</button><div id="tx-results"></div></div>`}
function bindTxFilters(){let els={q:document.getElementById('tx-search'),category:document.getElementById('tx-category'),method:document.getElementById('tx-method'),month:document.getElementById('tx-month'),order:document.getElementById('tx-order')};els.order.value=txFilters.order;for(const [k,e] of Object.entries(els)){if(!e)continue;e.addEventListener(k==='q'?'input':'change',()=>{txFilters[k]=e.value;renderTxResults()})}document.getElementById('clear-filters').onclick=()=>{txFilters={q:'',category:'',method:'',month:'',order:'newest'};render()};let back=document.getElementById('tx-back');if(back)back.onclick=()=>{selectedTxCategory=null;render();window.scrollTo(0,0)};renderTxResults()}

function categoryChart(){let vals={};for(const x of monthly())vals[x.category]=(vals[x.category]||0)+x.amount;let list=Object.entries(vals).sort((a,b)=>b[1]-a[1]),sum=list.reduce((a,x)=>a+x[1],0);if(!sum)return '<div class="empty">Add expenses this month to see your breakdown ♡</div>';let cursor=0;const stops=list.map(([_,v],i)=>{let a=cursor;cursor+=v/sum*100;return `${palette[i%palette.length]} ${a}% ${cursor}%`}).join(',');return `<div class="chart-row"><div class="donut" style="background:conic-gradient(${stops})"><div class="donut-label">THIS MONTH<b>${money(sum)}</b></div></div><div class="legend">${list.map(([name,v],i)=>`<div><i class="dot" style="--c:${palette[i%palette.length]}"></i>${esc(name)} <b>${Math.round(v/sum*100)}%</b></div>`).join('')}</div></div>`}
function previousMonthKey(){let d=new Date();return `${new Date(d.getFullYear(),d.getMonth()-1,1).getFullYear()}-${String(new Date(d.getFullYear(),d.getMonth()-1,1).getMonth()+1).padStart(2,'0')}`}
const oldRender=render;render=function(){oldRender();if(page==='transactions'){document.querySelector('#app').innerHTML=transactionPage();bindTxFilters()}if(page==='overview'){let grid=document.querySelector('#app .grid');let card=document.createElement('div');card.className='card spending analytics';let prev=state.expenses.filter(x=>x.date.startsWith(previousMonthKey())).reduce((s,x)=>s+x.amount,0);let current=total();let trend=prev>0?`${current>=prev?'↑':'↓'} ${Math.abs(Math.round((current-prev)/prev*100))}% compared with last month`:'No spending recorded last month';card.innerHTML=`<div class="cardhead"><div><h3>Where your money goes</h3><p>Based on your saved expenses · this month</p></div><span class="pill">${esc(trend)}</span></div>${categoryChart()}`;let recent=grid.querySelector('.transactions');grid.insertBefore(card,recent)}};
expenseForm=function(id){let x=state.expenses.find(item=>item.id===id)||{}, cats=allCategories(),selected=x.category||'Food & drinks';let opts=cats.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('');showForm(`<form id="expform"><h2>${id?'Edit':'Add'} an expense</h2><p>Tell us where your money went.</p><label>Restaurant, store or recipient</label><input name="merchant" value="${esc(x.merchant||'')}" required maxlength="80" placeholder="e.g. Your favorite restaurant"><div class="formgrid"><div><label>Amount (EGP)</label><input name="amount" type="number" min="0.01" step="0.01" value="${x.amount??''}" required placeholder="0.00"></div><div><label>Date</label><input name="date" type="date" value="${esc(x.date||now())}" required></div><div><label>Payment method</label><select name="method"><option ${x.method==='Cash'?'selected':''}>Cash</option><option ${x.method==='PayPal'?'selected':''}>PayPal</option></select></div><div><label>Category</label><select name="category" id="expense-category">${opts}<option value="__other__">Other — add a category</option></select></div><div id="otherbox" class="wide" style="display:none"><label>Category name</label><input name="other" maxlength="40" placeholder="e.g. Pets"></div><div class="wide"><label>Note (optional)</label><input name="note" maxlength="100" value="${esc(x.note||'')}" placeholder="Add a note"></div></div><p class="warning">PayPal entries are manual; automatic connection is not available yet.</p><div class="actions"><button class="secondary" type="button" onclick="closeForm()">Cancel</button><button class="primary">Save expense</button></div></form>`);document.getElementById('expense-category').onchange=e=>{document.getElementById('otherbox').style.display=e.target.value==='__other__'?'block':'none'};document.querySelector('#expform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),cat=f.get('category');if(cat==='__other__'){cat=String(f.get('other')||'').trim();if(!cat){alert('Please enter your category.');return}let match=cats.find(c=>c.toLocaleLowerCase()===cat.toLocaleLowerCase());if(match)cat=match}let merchant=String(f.get('merchant')).trim();if(!merchant){alert('Please enter a restaurant, store or recipient.');return}let item={merchant,amount:Number(f.get('amount')),expense_date:f.get('date'),method:f.get('method'),category:cat,note:String(f.get('note')).trim()};if(await writeData(()=>id?db.from('montra_expenses').update(item).eq('id',id):db.from('montra_expenses').insert(item))){closeForm();await loadData()}}};

// Income sources and monthly commitments are plans, not transactions.
const stage3Load=loadData;
loadData=async function(){try{let results=await Promise.all([db.from('montra_expenses').select('*'),db.from('montra_goals').select('*'),db.from('montra_budgets').select('*'),db.from('montra_profiles').select('*').maybeSingle(),db.from('montra_income_sources').select('*'),db.from('montra_commitments').select('*')]);for(const r of results)if(r.error)throw r.error;state={expenses:results[0].data.map(x=>({...x,date:x.expense_date,amount:Number(x.amount)})),goals:results[1].data.map(x=>({...x,target:Number(x.target),saved:Number(x.saved),monthly:Number(x.monthly)})),budgets:results[2].data.map(x=>({...x,limit:Number(x.budget_limit)})),income:Number(results[3].data?.income||0),incomes:results[4].data.map(x=>({...x,amount:Number(x.amount)})),commitments:results[5].data.map(x=>({...x,amount:Number(x.amount)}))};render()}catch(e){document.getElementById('app').innerHTML='<div class="card notice">Could not load your data. Please refresh and try again. '+esc(e.message)+'</div>'}};
function incomesTotal(){return Number(state.income||0)+(state.incomes||[]).reduce((a,x)=>a+Number(x.amount),0)}
function commitmentsTotal(){return (state.commitments||[]).reduce((a,x)=>a+Number(x.amount),0)}
function endMonthDays(){let d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()}
function nextDue(day){let d=new Date(), y=d.getFullYear(),m=d.getMonth(),today=d.getDate();let due=Math.min(day,new Date(y,m+1,0).getDate());if(due<today){m++;if(m>11){m=0;y++}due=Math.min(day,new Date(y,m+1,0).getDate())}let date=new Date(y,m,due);let days=Math.round((date-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);return {days,date:date.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}}
function deadlineMonths(date){if(!date)return null;let end=new Date(date+'T00:00:00'),d=new Date(),today=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.max(0,Math.ceil((end-today)/(365.2425/12*86400000)))}
function goalDetails(g){let remaining=Math.max(0,g.target-g.saved),n=g.monthly>0?Math.ceil(remaining/g.monthly):null,deadline=deadlineMonths(g.target_date),needed=deadline>0?remaining/deadline:null;let dateInfo=g.target_date?(deadline===0?(remaining?'Target date has arrived or passed.':'Goal reached!'):`Target ${esc(g.target_date)} · Approx. ${money(Math.ceil(needed))}/month needed over ${deadline} month${deadline===1?'':'s'}.`):'No target date set.';return `<div class="goal-details"><div class="forecast">${dateInfo}<br><span>Estimate assumes a fixed price and steady savings.</span></div><label for="scenario-${g.id}">Try an extra monthly saving (EGP)</label><input id="scenario-${g.id}" class="scenario" type="number" min="0" step="1" value="0" data-id="${g.id}"><div class="scenario-result" id="scenario-result-${g.id}">${remaining===0?'Goal reached!':n===null?'Enter an extra amount to see an estimate.':`At ${money(g.monthly)}/month: about ${n} months.`}</div></div>`}
function enhanceGoals(root=document){if(page!=='goals')return;for(let g of state.goals){let btn=root.querySelector(`[onclick="goalForm('${g.id}')"]`);if(!btn||btn.closest('.goalbox').querySelector('.goal-details'))continue;btn.closest('.goalbox').insertAdjacentHTML('beforeend',goalDetails(g));let input=document.getElementById('scenario-'+g.id);input.addEventListener('input',()=>{let extra=Math.max(0,Number(input.value)||0),rate=g.monthly+extra,remaining=Math.max(0,g.target-g.saved),out=document.getElementById('scenario-result-'+g.id);out.textContent=!remaining?'Goal reached!':rate>0?`At ${money(rate)}/month: about ${Math.ceil(remaining/rate)} months.`:'Enter a monthly amount to see an estimate.'})}}
const originalGoalForm=goalForm;
goalForm=function(id){let g=state.goals.find(x=>x.id===id)||{};originalGoalForm(id);let f=document.querySelector('#goalform');f.querySelector('.actions').insertAdjacentHTML('beforebegin',`<label for="goal-date">Target date (optional)</label><input type="date" name="target_date" id="goal-date" value="${esc(g.target_date||'')}">`);f.onsubmit=async e=>{e.preventDefault();let data=new FormData(f),v={name:String(data.get('name')).trim(),target:Number(data.get('target')),saved:Number(data.get('saved')),monthly:Number(data.get('monthly')),target_date:data.get('target_date')||null};if(!v.name){alert('Please enter a goal name.');return}if(await writeData(()=>id?db.from('montra_goals').update(v).eq('id',id):db.from('montra_goals').insert(v))){closeForm();await loadData()}}};
budgetHTML=function(){return state.budgets.length?'<div class="budget-list">'+state.budgets.map(b=>{let spend=monthly().filter(x=>x.category.toLocaleLowerCase()===b.category.toLocaleLowerCase()).reduce((a,x)=>a+x.amount,0),percentage=spend/b.limit*100,days=endMonthDays();let status=percentage>=100?'Limit reached or exceeded':percentage>=80?'Getting close to your limit': 'On track';return `<div class="budgetitem"><div class="budget-row"><b>${esc(b.category)}</b><span>${money(spend)} / ${money(b.limit)}</span></div><div class="bar"><i style="width:${Math.min(percentage,100)}%"></i></div><div class="budget-meta"><span class="${percentage>=80?'status-warning':''}">${status} · ${Math.round(percentage)}% used</span><span>${days} day${days===1?'':'s'} left this month</span></div><p class="warning">${spend>=b.limit?money(spend-b.limit)+' over your limit':money(b.limit-spend)+' left this month'}</p><button class="inlinebtn" onclick="editBudget('${b.id}')">Edit limit</button> <button class="delete" onclick="deleteItem('budgets','${b.id}')" aria-label="Delete budget">✕</button></div>`}).join('')+'</div>':'<div class="empty">No category limits yet. Add one to get started.</div>'};
function editBudget(id){let b=state.budgets.find(x=>x.id===id);if(!b)return;showForm(`<form id="editbudget"><h2>Edit monthly limit</h2><p>${esc(b.category)}</p><label>Monthly limit (EGP)</label><input name="limit" type="number" min="0.01" step="0.01" value="${b.limit}" required><div class="actions"><button type="button" class="secondary" onclick="closeForm()">Cancel</button><button class="primary">Save limit</button></div></form>`);document.querySelector('#editbudget').onsubmit=async e=>{e.preventDefault();let amount=Number(new FormData(e.target).get('limit'));if(await writeData(()=>db.from('montra_budgets').update({budget_limit:amount}).eq('id',id))){closeForm();await loadData()}}}
function plansList(type){let items=type==='income'?(state.incomes||[]):(state.commitments||[]);if(!items.length)return `<div class="empty compact">${type==='income'?'No additional income sources yet.':'No monthly commitments yet.'}</div>`;return items.map(x=>{let due=type==='commitment'?nextDue(x.due_day):null;return `<div class="tx"><div class="tx-icon">${type==='income'?'↗':'◷'}</div><div class="tx-text"><b>${esc(x.name)}</b><small>${type==='income'?'Monthly income':`Due on day ${x.due_day} · next ${due.date}${due.days<=7?' · coming up':''}`}</small></div><div class="amount">${money(x.amount)}<small>per month</small></div><button class="inlinebtn" onclick="planForm('${type}','${x.id}')">Edit</button><button class="delete" onclick="deletePlan('${type}','${x.id}')" aria-label="Delete ${type}">✕</button></div>`}).join('')}
function planForm(type,id){let isIncome=type==='income',arr=isIncome?(state.incomes||[]):(state.commitments||[]),x=arr.find(i=>i.id===id)||{},title=isIncome?'income source':'commitment';showForm(`<form id="planform"><h2>${id?'Edit':'Add'} ${title}</h2><p>${isIncome?'For example: salary or freelance work.':'For example: rent or a subscription.'}</p><label>Name</label><input name="name" maxlength="80" required value="${esc(x.name||'')}" placeholder="${isIncome?'Salary':'Rent'}"><label>Monthly amount (EGP)</label><input name="amount" type="number" min="0.01" step="0.01" value="${x.amount??''}" required>${isIncome?'':`<label>Day due each month</label><input name="due_day" type="number" min="1" max="31" step="1" value="${x.due_day??1}" required><p class="warning">Dates after the end of a shorter month are shown on that month’s last day.</p>`}<div class="actions"><button type="button" class="secondary" onclick="closeForm()">Cancel</button><button class="primary">Save</button></div></form>`);document.getElementById('planform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),v={name:String(f.get('name')).trim(),amount:Number(f.get('amount'))};if(!v.name){alert('Please enter a name.');return}if(!isIncome)v.due_day=Number(f.get('due_day'));let table=isIncome?'montra_income_sources':'montra_commitments';if(await writeData(()=>id?db.from(table).update(v).eq('id',id):db.from(table).insert(v))){closeForm();await loadData()}}}
async function deletePlan(type,id){if(!confirm('Delete this item?'))return;let table=type==='income'?'montra_income_sources':'montra_commitments';if(await writeData(()=>db.from(table).delete().eq('id',id)))await loadData()}
function accountsContent(){let upcoming=(state.commitments||[]).map(x=>({...x,next:nextDue(x.due_day)})).filter(x=>x.next.days<=7).sort((a,b)=>a.next.days-b.next.days);return header('Your money setup','Plan your income and monthly commitments.','')+`<div class="grid"><div class="card summary accent"><div class="label">Total monthly income</div><h2>${money(incomesTotal())}</h2><small>Including your existing income setting</small></div><div class="card summary"><div class="label">Monthly commitments</div><h2>${money(commitmentsTotal())}</h2><small>Planned, not automatically recorded</small></div><div class="card summary"><div class="label">Income less commitments</div><h2>${money(incomesTotal()-commitmentsTotal())}</h2><small>Before other expenses</small></div><div class="card summary"><div class="label">Due in the next 7 days</div><h2>${upcoming.length}</h2><small>In-app reminders</small></div><div class="card halfcard"><div class="cardhead"><div><h3>Monthly income sources</h3><p>Your recurring income, in one place</p></div><button class="inlinebtn" onclick="planForm('income')">＋ Add source</button></div><div class="legacy-income"><span>Existing monthly income</span><b>${money(state.income)}</b><button class="link" onclick="incomeForm()">Edit</button></div>${plansList('income')}</div><div class="card halfcard"><div class="cardhead"><div><h3>Monthly commitments</h3><p>Upcoming bills & subscriptions</p></div><button class="inlinebtn" onclick="planForm('commitment')">＋ Add</button></div>${plansList('commitment')}</div><div class="card panel"><h3>How these numbers work</h3><p class="warning">Commitments are reminders and are not added automatically to transactions. Income less commitments is a planning estimate before other spending. Avoid counting a payment twice when you add the actual expense.</p><p class="warning">PayPal is not connected yet; PayPal expenses can be added manually.</p></div></div>`}
const stage3Render=render;
render=function(){stage3Render();if(page==='accounts')document.getElementById('app').innerHTML=accountsContent();if(page==='goals'||page==='overview')enhanceGoals(document.getElementById('app'));if(page==='overview'){let cards=document.querySelectorAll('.summary');if(cards.length>=3){cards[0].querySelector('h2').textContent=money(incomesTotal());cards[0].querySelector('small').textContent='Monthly income sources and existing income';cards[2].querySelector('h2').textContent=money(incomesTotal()-total())}let due=(state.commitments||[]).map(x=>({...x,next:nextDue(x.due_day)})).filter(x=>x.next.days<=7).sort((a,b)=>a.next.days-b.next.days);if(due.length){let grid=document.querySelector('#app .grid'),note=document.createElement('div');note.className='card panel overview-upcoming';note.innerHTML='<div class="cardhead"><div><h3>Coming up</h3><p>Commitments due within 7 days</p></div><button class="link" onclick="navigate(\'accounts\')">View all ↗</button></div>'+due.map(x=>`<div class="tx"><div class="tx-icon">◷</div><div class="tx-text"><b>${esc(x.name)}</b><small>${x.next.days===0?'Due today':`Due in ${x.next.days} day${x.next.days===1?'':'s'}`}</small></div><div class="amount">${money(x.amount)}</div></div>`).join('');grid.appendChild(note)}}};

// Refined dashboard presentation using live account data.
const polishedRender=render;render=function(){polishedRender();if(page==='overview'){let grid=document.querySelector('#app .grid');if(!grid)return;let hero=document.createElement('section');hero.className='card hero';hero.innerHTML=`<div class="hero-copy"><span class="eyebrow">A little more in control ✦</span><h2>Make space for the things that matter.</h2><p>A clearer view of your spending, your plans, and all the goals you’re working toward.</p></div><div class="hero-art" aria-hidden="true"><i class="shape one"></i><i class="shape two"></i><i class="shape three"></i><i class="shape four"></i></div>`;grid.prepend(hero)}};
if(!db){authScreen('Could not load the secure sign-in service. Check your connection and refresh.');document.querySelector('#authform').remove()}else{recovery=location.hash.includes('type=recovery')||new URLSearchParams(location.search).get('reset')==='1';db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;authScreen('','reset')}});db.auth.getSession().then(({data})=>recovery?(data.session?authScreen('','reset'):authScreen('This reset link is invalid or expired. Request a new one.','forgot')):data.session?enterApp():authScreen()).catch(()=>authScreen('Connection failed. Please refresh.'))}</script></body></html>
